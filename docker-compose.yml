# Kendi sunucunda (VPS): alan adını Caddyfile'a yaz, .env oluştur, sonra:  docker compose up -d
services:
  pusula:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/pusula.db
      TRUST_PROXY: "1"
    volumes:
      - pusula-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [pusula]
volumes:
  pusula-data:
  caddy-data:
