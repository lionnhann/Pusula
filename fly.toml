# Fly.io: `fly launch --no-deploy --copy-config` → `fly volumes create pusula_data --size 1 --region fra` → `fly secrets set ...` → `fly deploy`
app = "pusula-DEGISTIR"      # benzersiz bir ad yaz
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/pusula.db"
  TRUST_PROXY = "1"

[[mounts]]
  source = "pusula_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
