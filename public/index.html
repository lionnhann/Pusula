<script>
// claude.ai dışında çalışması için: yapay zeka sağlayıcıları, veritabanı ve indirme bağlantılarını yerel olarak sağlar.
(function () {
  const ls = (k, d = "") => localStorage.getItem(k) || d;
  const P = {
    pusula: { n: "Pusula yapay zekâsı (anahtar gerekmez)", f: [], h: "Hesabınla giriş yaptıysan ek bir şey yapmana gerek yok. Mesajların Pusula sunucusu üzerinden yapay zekâ servisine gönderilir. Günlük mesaj sınırı vardır." },

    claude: { n: "Claude (Anthropic)", f: [["API anahtarı", "jarvis_key", "", "password"], ["Model", "jarvis_cmodel", "claude-sonnet-5-5"]],

    gemini: { n: "Gemini (Google)", f: [["API anahtarı", "jarvis_key_gemini", "", "password"], ["Model", "jarvis_gmodel", "gemini-3.8-flash"]],
      h: "aistudio.google.com/apikey adresinden anahtar al. Ücretsiz kota olabilir; sınırları ve güncel model adlarını Google'dan kontrol et." },
    openai: { n: "ChatGPT (OpenAI)", f: [["API anahtarı", "jarvis_key_openai", "", "password"], ["Model", "jarvis_omodel", "gpt-4o-mini"]],
      h: "platform.openai.com adresinden anahtar al. ChatGPT aboneliğinden ayrıdır, API kullanımı ücretlidir. Güncel model adlarını OpenAI'dan kontrol et." },
    custom: { n: "Diğer (OpenAI uyumlu: Groq, OpenRouter, DeepSeek…)", f: [["API adresi", "jarvis_xurl", "https://api.groq.com/openai/v1"], ["API anahtarı", "jarvis_key_custom", "", "password"], ["Model", "jarvis_xmodel", ""]],
      h: "Groq ve OpenRouter ücretsiz modeller sunabilir. Adresi ve model adını sağlayıcının sitesinden kontrol et." }
  };
  function settings() {
    if (document.getElementById("kbox")) return;
    if (!srvCfg()) delete P.pusula;
    const d = document.createElement("div"); d.id = "kbox";
    d.style.cssText = "position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:99;overflow:auto";
    document.body.appendChild(d);
    d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-label","Yapay zeka ayarları");
    const prev = document.activeElement, closeD = () => { d.remove(); if (prev && prev.focus) try { prev.focus(); } catch (e) {} };
    const inp = "width:100%;padding:8px;border-radius:8px;border:1px solid #1c3252;background:#070c15;color:#e8f2ff;margin:4px 0 10px";
    const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    function render(pv) {
      d.innerHTML = '<div style="background:#0d1626;color:#e8f2ff;padding:20px;border-radius:14px;width:min(540px,92vw);font:15px system-ui;margin:auto">' +
        '<b>Yapay zeka seç</b><select id="kpv" style="' + inp + ';margin-top:10px">' + Object.keys(P).map(k => '<option value="' + k + '"' + (k === pv ? " selected" : "") + ">" + P[k].n + "</option>").join("") + "</select>" +
        P[pv].f.map((f, i) => '<label style="font-size:13px;color:#8fa5bd">' + f[0] + '</label><input id="kf' + i + '" type="' + (f[3] || "text") + '" value="' + esc(ls(f[1], f[2])) + '" style="' + inp + '">').join("") +
        '<div style="color:#8fa5bd;font-size:13px">' + P[pv].h + "</div>" +
        (pv === "pusula" ? '<div style="color:#f2b84b;font-size:13px;margin-top:8px">Dikkat: görevlerin, notların ve kasa bilgilerin cevap üretmek için Pusula sunucusu aracılığıyla yapay zekâ servisine gönderilir.</div>' : pv !== "ollama" ? '<div style="color:#f2b84b;font-size:13px;margin-top:8px">Dikkat: bu seçenekte görevlerin, notların ve kasa bilgilerin cevap üretmek için bu şirkete gönderilir.</div>' : "") +
        '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button id="kc">İptal</button><button id="ks">Kaydet</button></div></div>';
      d.querySelector("#kpv").onchange = e => render(e.target.value);
      d.querySelector("#kc").onclick = closeD;
      d.querySelector("#ks").onclick = () => {
        localStorage.setItem("jarvis_mode", pv);
        P[pv].f.forEach((f, i) => localStorage.setItem(f[1], d.querySelector("#kf" + i).value.trim() || f[2]));
        closeD();
      };
    }
    render(P[ls("jarvis_mode")] ? ls("jarvis_mode") : (P.pusula ? "pusula" : "ollama")); setTimeout(() => { const f = d.querySelector("#kpv"); if (f) f.focus(); }, 50);
  }
  async function post(url, h, b, sig, retry = true) {
    let r;
    try { r = await fetch(url, { method: "POST", headers: Object.assign({ "content-type": "application/json" }, h), body: JSON.stringify(b), signal: sig }); }
    catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network", message: "Bağlantı kurulamadı veya iptal edildi." }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (retry && (r.status === 429 || r.status === 503 || r.status === 529)) { await new Promise(x => setTimeout(x, window.__RETRY_MS || 1500)); return post(url, h, b, sig, false); }

  const AIERR = { ai_quota: "Bugünlük yapay zekâ hakkın doldu. Yarın yenilenir.", ai_busy: "Yapay zekâ şu an yoğun. Biraz sonra tekrar dene.", ai_failed: "Yapay zekâ cevap veremedi. Tekrar dene.", ai_off: "Yapay zekâ şu an kapalı. 🔑 düğmesinden kendi anahtarını girebilirsin.", ai_empty: "Boş cevap geldi. Tekrar dene.", rate_limited: "Çok hızlı gönderiyorsun. Biraz bekle.", too_large: "Mesaj çok uzun.", unauthorized: "Oturumun sona ermiş. Yeniden giriş yap." };
  async function viaSrv(turns, o) {
    let r;
    try { r = await srvCall("POST", "/api/ai", { messages: turns }); }
    catch (e) { throw { code: "network", message: "Sunucuya ulaşılamadı. İnternetini kontrol et." }; }
    if (r.s === 401) { try { srvAuthLost(); } catch (e) {} throw { code: "unauthorized", message: AIERR.unauthorized }; }
    if (r.refused) throw { code: "refused", message: "" };
    if (r.s !== 200 || typeof r.text !== "string") throw { code: r.error || "api_error", message: AIERR[r.error] || ("Yapay zekâ hatası (" + r.s + ").") };

  }
  async function sample(turns, o = {}) {
    let m = window.pusulaAI();
    if (m === "pusula") { const x = await viaSrv(turns, o); if (o.onText) o.onText({ text: x.text, delta: x.text }); return x; }
    if (!m && srvCfg()) { throw { code: "no_login", message: "Yapay zekâyı kullanmak için önce hesabınla giriş yap." }; }
    if (!m || !P[m]) { settings(); throw { code: "no_setup", message: "Önce sol alttaki 🔑 düğmesinden yapay zekayı seç." }; }
    const need = k => { const v = ls(k); if (!v) { settings(); throw { code: "no_key", message: "API anahtarı girilmemiş (🔑)." }; } return v; };
    let text = "", trunc = false;
    if (m === "ollama") {
      const model = ls("jarvis_model", "qwen2.5:7b"); let r;
      try { r = await fetch("http://localhost:11434/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ model, messages: turns, stream: true, options: { num_ctx: 8192, num_predict: 4096 } }), signal: o.signal }); }
      catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "ollama_down", message: "Ollama'ya ulaşılamadı. Ollama açık mı? Açıksa Windows ortam değişkenlerine OLLAMA_ORIGINS=* ekleyip Ollama'yı yeniden başlat." }; }
      if (!r.ok) { let msg = await r.text(); try { msg = JSON.parse(msg).error || msg; } catch (e) {} throw { code: "ollama_error", message: msg + (r.status === 404 ? " (model yüklü değil: cmd'de ollama pull " + model + ")" : "") }; }
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";

        { model: ls("jarvis_cmodel", "claude-sonnet-5-5"), max_tokens: 8000, messages: turns }, o.signal);
      text = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("\n"); trunc = j.stop_reason === "max_tokens";
      if (j.stop_reason === "refusal") throw { code: "refused", message: "" };

async function e2eDecDm(h,text){const m=/^e2e1:([0-9a-f]{16})\.([0-9a-f]{16}):([A-Za-z0-9_-]+)$/.exec(text);if(!m)throw{error:"bad"};await e2eInit();const my=E2E.me.fp;let other;if(m[1]===my)other=m[2];else if(m[2]===my)other=m[1];else throw{error:"other_key"};let pe=await e2ePeer(h);let e=pe.by[other];if(!e){pe=await e2ePeer(h,true);e=pe.by[other]}if(!e)throw{error:"nopeer"};const key=await e2ePair(e.pub,other);return JSON.parse(e2td.decode(await e2eOpen(key,m[3],"dm:"+m[1]+"."+m[2])))}
async function e2eGroupKeys(gid,force){const c=E2E.gk[gid];if(c&&!force&&Date.now()-c.t<15000)return c;await e2eInit();const r=await soc("gkeys",{id:gid});if(r.s!==200)throw r;const keys=c?c.keys:{};
 for(const k of r.keys){if(keys[k.epoch]||k.to_fp!==E2E.me.fp)continue;try{let pe=await e2ePeer(k.by),e=pe.by[k.by_fp];if(!e){pe=await e2ePeer(k.by,true);e=pe.by[k.by_fp]}if(!e)continue;keys[k.epoch]=await e2eOpen(await e2ePair(e.pub,k.by_fp),k.wrapped,"gk:"+gid+":"+k.epoch)}catch(x){}}
 return E2E.gk[gid]={t:Date.now(),keys,epoch:r.epoch,rotate:r.rotate,members:r.members}}
async function e2eGroupEnsure(gid,rotate){let g=await e2eGroupKeys(gid,true);
 const wrap=async(epoch,raw,list)=>{const items=[];for(const m of list){if(!m.pub||!m.fp)continue;const key=await e2ePair(b64u8(m.pub),m.fp);items.push({handle:m.handle,to_fp:m.fp,wrapped:await e2eSeal(key,raw,"gk:"+gid+":"+epoch)})}return items.length?soc("gkeys_put",{id:gid,epoch,items}):{s:200}};
 if(g.epoch===0||g.rotate||rotate){await wrap(g.epoch+1,crypto.getRandomValues(new Uint8Array(32)),g.members);g=await e2eGroupKeys(gid,true)}
 else if(g.keys[g.epoch]){const miss=g.members.filter(m=>!m.have&&m.pub);if(miss.length){await wrap(g.epoch,g.keys[g.epoch],miss);g=await e2eGroupKeys(gid,true)}}
 return g}
async function e2eEncGroup(gid,pl){await e2eInit();if(E2E.stale)throw{error:"key_stale"};let g=await e2eGroupKeys(gid,true);if(g.epoch===0||g.rotate||!g.keys[g.epoch]||g.members.some(m=>!m.have&&m.pub))g=await e2eGroupEnsure(gid);const ep=g.epoch;if(!ep||!g.keys[ep])throw{error:"group_waiting"};const key=await crypto.subtle.importKey("raw",g.keys[ep],"AES-GCM",false,["encrypt"]);return "e2e1:g"+ep+":"+await e2eSeal(key,e2te.encode(JSON.stringify(pl)),"g:"+gid+":"+ep)}
async function e2eDecG(gid,text){const m=/^e2e1:g([0-9]+):([A-Za-z0-9_-]+)$/.exec(text);if(!m)throw{error:"bad"};const g=await e2eGroupKeys(gid),raw=g.keys[m[1]];if(!raw)throw{error:"nokey"};const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return JSON.parse(e2td.decode(await e2eOpen(key,m[2],"g:"+gid+":"+m[1])))}
async function e2eEncBlob(blob){const raw=crypto.getRandomValues(new Uint8Array(32)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,await blob.arrayBuffer());return{blob:new Blob([ct],{type:"application/octet-stream"}),k:u8b64(raw),i:u8b64(iv)}}
const E2MIME=/^(image\/(jpeg|png|webp)|video\/(mp4|webm|quicktime)|audio\/(webm|mp4|ogg))$/;
async function e2eMedia(em){const F=window.CapacitorWebFetch||fetch;let buf;try{const r=await F(em.u);if(!r.ok)throw 0;buf=await r.arrayBuffer()}catch(e){const t=srvTok()||{},k=String(em.u).split("/").slice(-3).join("/");const r=await F((t.url||"")+"/api/social/e2e_blob",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t.token},body:JSON.stringify({key:k})});if(!r.ok)throw{error:"blob"};buf=await r.arrayBuffer()}
 const key=await crypto.subtle.importKey("raw",b64u8(em.k),"AES-GCM",false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(em.i)},key,buf);return URL.createObjectURL(new Blob([pt],{type:em.y}))}
function e2eHydrate(root){root.querySelectorAll(".soenc[data-ek]").forEach(el=>{const em=(SO.em||{})[el.dataset.ek];el.removeAttribute("data-ek");if(!em){el.textContent="🔒 Ek açılamadı";return}

async function e2eDecMsgs(msgs,c){SO.em=SO.em||{};await e2eInit().catch(()=>{});
 for(const m of msgs){if(!/^e2e1:/.test(m.text||""))continue;
  try{const pl=c.t==="d"?await e2eDecDm(c.h,m.text):await e2eDecG(c.id,m.text);m.text=String(pl.t==null?"":pl.t).slice(0,1000);
   if(m.media){const x=pl.m;if(x&&E2MIME.test(String(x.y))&&/^[A-Za-z0-9_-]{43}$/.test(String(x.k))&&/^[A-Za-z0-9_-]{16}$/.test(String(x.i))&&soUrl(m.media)){SO.em[m.id]={u:soUrl(m.media),k:x.k,i:x.i,y:x.y};m.enc=true}else{m.media="";m.text=m.text||"🔒 Ek açılamadı"}}}
  catch(e){m.text=e&&e.error==="nokey"?"🔒 Bu mesaj gruba katılmadan önce gönderildi, anahtarı bu cihazda yok.":"🔒 Bu mesaj bu cihazda açılamadı (anahtar değişmiş olabilir).";m.media="";m.enc=false}}}
async function e2ePreviews(chats){await e2eInit().catch(()=>{});await Promise.all(chats.map(async c=>{if(!/^e2e1:/.test(c.text||""))return;try{const pl=c.type==="group"?await e2eDecG(c.id,c.text):await e2eDecDm(c.handle,c.text);c.text=pl.t||(pl.m?(/^audio/.test(pl.m.y)?"🎤 Sesli mesaj":/^video/.test(pl.m.y)?"🎬 Video":"📷 Fotoğraf"):"")}catch(e){c.text="🔒 Şifreli mesaj"}}))}

 if(o.media){const e=await e2eEncBlob(o.media.blob);mk=await soUpload(e.blob,"application/octet-stream");pl.m={k:e.k,i:e.i,y:o.media.type}}
 const go=async f=>{const text=c.t==="d"?await e2eEncDm(c.h,pl,f):await e2eEncGroup(c.id,pl);return c.t==="d"?soc("send",{handle:c.h,text,media:mk}):soc("gsend",{id:c.id,text,media:mk})};
 let r=await go(false);if(r.s===409&&(r.error==="key_changed"||r.error==="bad_epoch")){if(c.t==="d")E2E.peers={};else delete E2E.gk[c.id];r=await go(true)}return r}
