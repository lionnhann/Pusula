<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pusula Yönetim</title>
<style>
:root{--bg:#0b1020;--p:#121a2e;--p2:#1a2440;--bd:#26324f;--tx:#e8edf7;--mu:#94a3c0;--ac:#22d3ee;--bad:#f87171;--ok:#4ade80;--warn:#fbbf24}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fb;--p:#fff;--p2:#eef2f9;--bd:#d6deec;--tx:#14203a;--mu:#5b6a88;--ac:#0891b2;--bad:#dc2626;--ok:#16a34a;--warn:#b45309}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button,input{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button.pr{background:var(--ac);color:#04121a;border-color:transparent;font-weight:600}button.bad{color:var(--bad)}button:disabled{opacity:.5}
input{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.tabs{display:flex;gap:6px;margin:12px 0;overflow:auto}.tabs button.on{background:var(--ac);color:#04121a;border-color:transparent;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.stat{background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:10px}.stat b{font-size:22px;display:block}.stat span{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--p2);border:1px solid var(--bd);color:var(--mu)}
.mu{color:var(--mu)}.ev{background:var(--p2);border-left:3px solid var(--warn);padding:8px 10px;border-radius:8px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.thumb{max-width:100%;max-height:260px;border-radius:10px;margin:8px 0;display:block}.msg{min-height:1.3em;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="row"><h1>🧭 Pusula Yönetim</h1><span class="sp"></span><button id="out" hidden>Çıkış</button></div>
<div id="login" class="card" hidden>
 <h2>Yönetici girişi</h2>
 <p class="mu">Render'da tanımladığın <code>ADMIN_TOKEN</code> değerini yaz. Bu sayfa yalnızca bu sekme açıkken hatırlanır.</p>
 <input id="tok" type="password" autocomplete="off" placeholder="Yönetici anahtarı">
 <p id="le" class="msg" style="color:var(--bad)"></p>
 <button id="go" class="pr">Giriş</button>
</div>
<div id="app" hidden>
 <div class="tabs" id="tabs"><button data-t="sum" class="on">Özet</button><button data-t="rep">Şikâyetler</button><button data-t="usr">Kullanıcılar</button><button data-t="pst">Gönderiler</button></div>
 <p id="msg" class="msg"></p>
 <div id="view"></div>
</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000);return s<60?"şimdi":s<3600?Math.floor(s/60)+" dk önce":s<86400?Math.floor(s/3600)+" sa önce":Math.floor(s/86400)+" gün önce"};
const mediaOk=u=>/^(\/media\/m\/[A-Za-z0-9_\/.-]+|https:\/\/[^\s"'<>]+)$/.test(u||"");
let TOK="";try{TOK=sessionStorage.getItem("pusula_adm")||""}catch(e){}
async function api(p,b){try{const r=await fetch("/api/admin/"+p,{method:"POST",headers:{"Content-Type":"application/json","x-admin-token":TOK},body:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));return Object.assign({s:r.status},j)}catch(e){return{s:0,error:"net"}}}
function say(t,bad){const m=$("#msg");m.style.color=bad?"var(--bad)":"var(--ok)";m.textContent=t||""}
function show(ok){$("#login").hidden=ok;$("#app").hidden=!ok;$("#out").hidden=!ok}
async function enter(){const r=await api("stats");if(r.s===200){try{sessionStorage.setItem("pusula_adm",TOK)}catch(e){}show(true);tab("sum")}else{show(false);$("#le").textContent=r.s===401?"Anahtar yanlış.":r.s===404?"Yönetici anahtarı sunucuda tanımlı değil (Render > Environment > ADMIN_TOKEN).":r.s===429?"Çok fazla deneme, biraz bekle.":"Sunucuya ulaşılamadı."}}
$("#go").onclick=()=>{TOK=$("#tok").value.trim();if(TOK)enter()};
$("#tok").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
$("#out").onclick=()=>{TOK="";try{sessionStorage.removeItem("pusula_adm")}catch(e){}$("#tok").value="";show(false)};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)tab(b.dataset.t)};
let CUR="sum";
async function tab(t){CUR=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));say("");const v=$("#view");v.innerHTML='<p class="mu">Yükleniyor…</p>';
 if(t==="sum")return sum(v);if(t==="rep")return rep(v);if(t==="usr")return usr(v);return pst(v)}
async function sum(v){const r=await api("stats");if(r.s!==200){v.innerHTML='<p style="color:var(--bad)">Alınamadı.</p>';return}
 const S=[["Kullanıcı",r.users],["Son 7 gün yeni",r.users7],["Profil",r.profiles],["Paylaşım",r.posts],["Son 7 gün paylaşım",r.posts7],["Aktif hikâye",r.stories],["Mesaj (şifreli)",r.msgs],["Grup",r.groups],["Açık şikâyet",r.reports],["Yasaklı",r.bans],["Şifreleme anahtarı",r.e2e_keys]];
 v.innerHTML='<div class="card"><div class="stats">'+S.map(x=>`<div class="stat"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join("")+'</div></div><p class="mu">Mesaj içerikleri uçtan uca şifreli olduğu için burada görünmez; yalnızca şikâyet edilen mesajın metni kanıt olarak gelir.</p>'}
const KIND={live:"Canlı yayın",sound:"Ses",community:"Topluluk",listing:"İlan",post:"Gönderi",story:"Hikâye",comment:"Yorum",user:"Kullanıcı",msg:"Mesaj",group:"Grup"};
async function rep(v){const r=await api("reports");if(r.s!==200){v.innerHTML='<p style="color:var(--bad)">Alınamadı.</p>';return}
 if(!r.reports.length){v.innerHTML='<div class="card">Açık şikâyet yok. 🎉</div>';return}
 v.innerHTML=r.reports.map(x=>{const rm=x.kind==="post"?{post:x.target}:x.kind==="story"?{story:x.target}:x.kind==="comment"?{comment:x.target}:x.kind==="msg"?{msg:x.target}:x.kind==="community"?{community:x.target}:x.kind==="listing"?{listing:x.target}:x.kind==="sound"?{sound:x.target}:x.kind==="live"?{live:x.target}:null;
  const bh=x.kind==="user"?x.target:x.target_handle;
  return `<div class="card" data-id="${esc(x.id)}"><div class="row"><span class="tag">${esc(KIND[x.kind]||x.kind)}</span><span class="mu">@${esc(x.reporter_handle||"?")} bildirdi · ${ago(x.created)}</span>${bh?`<span class="sp"></span><b>@${esc(bh)}</b>`:""}</div>
  ${x.reason?`<p><b>Neden:</b> ${esc(x.reason)}</p>`:""}${x.preview?`<div class="ev">${esc(x.preview)}</div>`:""}${x.evidence?`<div class="ev"><b>Kanıt (şikâyet eden gönderdi):</b>\n${esc(x.evidence)}</div>`:""}
  ${x.media&&mediaOk(x.media)?(/\.(mp4|webm|mov)$/.test(x.media)?`<video class="thumb" src="${esc(x.media)}" controls preload="metadata"></video>`:`<img class="thumb" src="${esc(x.media)}" alt="">`):""}
  <div class="row">${rm?`<button class="bad" data-a="rm" data-p='${esc(JSON.stringify(rm))}'>İçeriği kaldır</button>`:""}${bh?`<button class="bad" data-a="ban" data-h="${esc(bh)}">Kullanıcıyı yasakla</button>`:""}<button data-a="clr">Şikâyeti kapat</button></div></div>`}).join("");
 v.onclick=async e=>{const b=e.target.closest("button");if(!b||!b.dataset.a)return;const c=b.closest(".card"),id=c.dataset.id;
  if(b.dataset.a==="rm"){if(!confirm("İçerik kalıcı olarak silinsin mi?"))return;const r=await api("remove",Object.assign(JSON.parse(b.dataset.p),{clear:id}));if(r.s===200){say("İçerik kaldırıldı, şikâyet kapatıldı.");c.remove()}else say("Hata oluştu.",1)}
  else if(b.dataset.a==="ban"){const why=prompt("Yasak nedeni (kısa):","kurallara aykırı içerik");if(why===null)return;const r=await api("remove",{ban:b.dataset.h,reason:why});say(r.s===200?"@"+b.dataset.h+" yasaklandı.":"Hata oluştu.",r.s!==200)}
  else if(b.dataset.a==="clr"){const r=await api("remove",{clear:id});if(r.s===200){say("Şikâyet kapatıldı.");c.remove()}else say("Hata oluştu.",1)}}}
async function usr(v){v.innerHTML='<div class="card"><div class="row"><input id="uq" placeholder="Kullanıcı adı veya e-posta ara" style="flex:1;min-width:180px"><button id="ug" class="pr">Ara</button></div></div><div id="ul"></div>';
 const load=async()=>{const r=await api("users",{q:$("#uq").value.trim()});const l=$("#ul");if(r.s!==200){l.innerHTML='<p style="color:var(--bad)">Alınamadı.</p>';return}
  l.innerHTML=r.users.map(u=>`<div class="card row"><div><b>${u.handle?"@"+esc(u.handle):"<i>profil yok</i>"}</b> ${u.banned?'<span class="tag" style="color:var(--bad)">yasaklı</span>':""}<br><span class="mu">${esc(u.email)} · ${new Date(u.created).toLocaleDateString("tr-TR")} · ${u.posts} paylaşım</span></div><span class="sp"></span>${u.handle?(u.banned?`<button data-a="unban" data-h="${esc(u.handle)}">Yasağı kaldır</button>`:`<button class="bad" data-a="ban" data-h="${esc(u.handle)}">Yasakla</button>`):""}</div>`).join("")||'<p class="mu">Sonuç yok.</p>'};
 $("#ug").onclick=load;$("#uq").onkeydown=e=>{if(e.key==="Enter")load()};load();
 $("#ul").onclick=async e=>{const b=e.target.closest("button");if(!b||!b.dataset.a)return;if(b.dataset.a==="ban"){const why=prompt("Yasak nedeni (kısa):","kurallara aykırı davranış");if(why===null)return;await api("remove",{ban:b.dataset.h,reason:why});say("@"+b.dataset.h+" yasaklandı.")}else{await api("remove",{unban:b.dataset.h});say("Yasak kaldırıldı.")}load()}}
async function pst(v){v.innerHTML='<div class="card"><div class="row"><input id="pq" placeholder="Kullanıcı adı (boşsa son paylaşımlar)" style="flex:1;min-width:180px"><button id="pg" class="pr">Göster</button></div></div><div id="pl"></div>';
 const load=async()=>{const r=await api("posts",{handle:$("#pq").value.trim()});const l=$("#pl");if(r.s!==200){l.innerHTML='<p style="color:var(--bad)">Alınamadı.</p>';return}
  l.innerHTML=r.posts.map(p=>`<div class="card" data-id="${esc(p.id)}"><div class="row"><b>@${esc(p.handle)}</b><span class="mu">${ago(p.created)}</span><span class="tag">${esc(p.kind)}</span></div>${p.text?`<p>${esc(p.text)}</p>`:""}${p.media&&mediaOk(p.media)?(p.kind==="reel"?`<video class="thumb" src="${esc(p.media)}" controls preload="metadata"></video>`:`<img class="thumb" src="${esc(p.media)}" alt="">`):""}<div class="row"><button class="bad" data-a="rm">Kaldır</button><button class="bad" data-a="ban" data-h="${esc(p.handle)}">Kullanıcıyı yasakla</button></div></div>`).join("")||'<p class="mu">Gönderi yok.</p>'};
 $("#pg").onclick=load;$("#pq").onkeydown=e=>{if(e.key==="Enter")load()};load();
 $("#pl").onclick=async e=>{const b=e.target.closest("button");if(!b||!b.dataset.a)return;const c=b.closest(".card");if(b.dataset.a==="rm"){if(!confirm("Gönderi kalıcı olarak silinsin mi?"))return;const r=await api("remove",{post:c.dataset.id});if(r.s===200){say("Gönderi kaldırıldı.");c.remove()}}else{const why=prompt("Yasak nedeni (kısa):","kurallara aykırı içerik");if(why===null)return;await api("remove",{ban:b.dataset.h,reason:why});say("@"+b.dataset.h+" yasaklandı.")}}}
if(TOK)enter();else show(false);
</script>
</body>
</html>
