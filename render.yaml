# Render "Blueprint": depoyu GitHub'a yükle → Render'da New → Blueprint → bu depoyu seç.
services:
  - type: web
    name: pusula
    runtime: docker
    plan: starter          # kalıcı disk için ücretli plan gerekir (güncel fiyatı Render'da kontrol et)
    healthCheckPath: /api/health
    disk:
      name: pusula-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/pusula.db
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LS_CHECKOUT_URL
        sync: false
      - key: LS_WEBHOOK_SECRET
        sync: false
      - key: PRO_PRICE_LABEL
        sync: false
