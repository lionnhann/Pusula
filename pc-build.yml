name: Pusula bilgisayar uygulamasi

# Actions sekmesinden "Pusula bilgisayar uygulamasi" -> "Run workflow" ile calistirilir.
# Bitince Releases sayfasinda "pusula-pc" surumune Windows / Mac / Linux kurulum dosyalari eklenir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kur ve uret
        working-directory: pc
        run: |
          npm install
          npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: pusula-${{ matrix.os }}
          path: |
            pc/dist/*.exe
            pc/dist/*.dmg
            pc/dist/*.AppImage
            pc/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dosyalar
          merge-multiple: true
      - name: Dosyalari goster
        run: ls -la dosyalar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pusula-pc
          name: Pusula bilgisayar uygulamasi
          body: "Pusula'yi bilgisayarina kur: Windows (Kurulum veya Tasinabilir), Mac (Apple Silicon: arm64, Intel: x64), Linux (AppImage veya deb)."
          make_latest: "true"
          files: dosyalar/*
